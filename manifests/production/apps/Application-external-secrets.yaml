apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/production/external-secrets
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
