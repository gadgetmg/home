apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-snapshotter
  namespace: argocd
spec:
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/production/csi-snapshotter
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
