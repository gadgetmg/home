apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crds
  namespace: argocd
spec:
  destination:
    namespace: crds
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/production/crds
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
