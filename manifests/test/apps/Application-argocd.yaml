apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/test/argocd
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
