apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  destination:
    namespace: external-dns
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/test/external-dns
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
