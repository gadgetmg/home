apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: default-namespace
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/test/default-namespace
    repoURL: https://github.com/gadgetmg/home.git
    targetRevision: main
  syncPolicy: {}
