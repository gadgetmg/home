apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ezxss
  name: ezxss-db
  namespace: ezxss
spec:
  affinity:
    antiAffinityEnabled: true
  database: ezxss
  galera:
    agent:
      image: ghcr.io/mariadb-operator/mariadb-operator:26.10.2@sha256:f4b1f260a85f52ba54e537eb18ec9f7502aaa5d3234ce84f07cc43481d6a3076
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    config:
      volumeClaimTemplate:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
        storageClassName: ssd-r1
    enabled: true
    initContainer:
      image: ghcr.io/mariadb-operator/mariadb-operator:26.10.2@sha256:f4b1f260a85f52ba54e537eb18ec9f7502aaa5d3234ce84f07cc43481d6a3076
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
  image: ghcr.io/mariadb/mariadb:12.3.4-noble@sha256:d82229fd0040eb4c3e7b04cdc158a699d487f8d33374b5829699bc534f410d0f
  metrics:
    enabled: true
    exporter:
      image: docker.io/prom/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
      podSecurityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
  podSecurityContext:
    fsGroup: 999
    runAsGroup: 999
    runAsNonRoot: true
    runAsUser: 999
    seccompProfile:
      type: RuntimeDefault
  replicas: 3
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
  storage:
    size: 10Gi
    storageClassName: ssd-r1
  username: ezxss
