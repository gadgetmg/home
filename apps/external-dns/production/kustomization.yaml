# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- secret.yaml

components:
- ../../../shared/components/strip-helm-labels
- ../../../shared/components/k8s-digester

helmCharts:
- name: external-dns
  repo: https://kubernetes-sigs.github.io/external-dns
  releaseName: pfsense
  namespace: external-dns
  version: 1.24.0
  valuesInline:
    sources:
    - gateway-grpcroute
    - gateway-httproute
    - gateway-tlsroute
    - gateway-tcproute
    - gateway-udproute
    policy: upsert-only
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/slamdev/external-dns-pfsense-webhook
          # renovate: datasource=docker depName=ghcr.io/slamdev/external-dns-pfsense-webhook
          tag: latest@sha256:79ea27bf19476d6b42fe10ac72166d0aadd6cb24c1ca813a1b1dadbfa24dcf6c
        ports:
        - name: http
          containerPort: 8888
        - name: monitoring
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        env:
        - name: APP_PFSENSE_URL
          value: https://router.lan.seigra.net
        - name: APP_PFSENSE_USERNAME
          valueFrom:
            secretKeyRef:
              name: pfsense-provider-auth
              key: username
        - name: APP_PFSENSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pfsense-provider-auth
              key: password
        - name: APP_DRYRUN
          value: "false"
        startupProbe:
          httpGet:
            path: /ready
            port: monitoring
        livenessProbe:
          httpGet:
            path: /live
            port: monitoring
        readinessProbe:
          httpGet:
            path: /ready
            port: monitoring
