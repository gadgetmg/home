# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- clusterroles.yaml

components:
- ../../../shared/components/strip-helm-labels
- ../../../shared/components/kapp-noop-helm-hooks
- ../../../shared/components/k8s-digester

helmCharts:
- name: kyverno
  repo: https://kyverno.github.io/kyverno/
  releaseName: kyverno
  namespace: kyverno
  version: 3.10.0
  apiVersions:
  - policy/v1/PodDisruptionBudget
  valuesInline:
    global:
      image:
        registry: ghcr.io
    upgrade:
      legacyPolicyCheck:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno-cli
          tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
    crds:
      migration:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno-cli
          tag: v1.20.0@sha256:bd2b8b7c9d550ecf04e0bacaf351adce2f82ce67fd3f291075edcee7f8ab4ab4
    test:
      image:
        # renovate: datasource=docker depName=ghcr.io/kyverno/readiness-checker
        tag: v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c
    webhooksCleanup:
      image:
        # renovate: datasource=docker depName=ghcr.io/kyverno/readiness-checker
        tag: v1.20.0@sha256:6079a30d75fe7ba868a5a7e5dfa71ee92a3a8bae97adcea1c8cfb1009280ee6c
    admissionController:
      initContainer:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyvernopre
          tag: v1.20.0@sha256:339067e083430e0c97007541bef9cfdbac89bee13f7228772c77ae8aead14b8b
      container:
        image:
          # renovate: datasource=docker depName=ghcr.io/kyverno/kyverno
          tag: v1.20.0@sha256:9de49c5416ea536f00a205527197ac048abdf32c5a75d633cd9afff8928f359d
      replicas: 2
      serviceMonitor:
        enabled: true
    backgroundController:
      image:
        # renovate: datasource=docker depName=ghcr.io/kyverno/background-controller
        tag: v1.20.0@sha256:c72df38320a48fc9de10f9d23d087a117853bb08207b7f60f6d1e8457fb3ddb7
      replicas: 2
      serviceMonitor:
        enabled: true
    cleanupController:
      image:
        # renovate: datasource=docker depName=ghcr.io/kyverno/cleanup-controller
        tag: v1.20.0@sha256:0f9ce0c203561c52499e871a987ff987371f57385fcafe7af1a01dfd6db1feee
      replicas: 2
      serviceMonitor:
        enabled: true
    reportsController:
      image:
        # renovate: datasource=docker depName=ghcr.io/kyverno/reports-controller
        tag: v1.20.0@sha256:f54e3cc106fadb1a615d0ec11c42f741f51d3580a5f70dfbe7bd7ec58864ef03
      replicas: 2
      serviceMonitor:
        enabled: true
