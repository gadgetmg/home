# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

resources:
- namespace.yaml
- gateway.yaml
- httproute.yaml
- core
- database
- jobservice
- portal
- redis
- registry
- trivy
- keycloak

components:
- ../../../shared/components/crd-configurations

configMapGenerator:
- name: harbor-common
  literals:
  - CORE_URL=http://harbor-core:80
  - LOG_LEVEL=info
  - REGISTRY_CONTROLLER_URL=http://harbor-registry:8080
  - REGISTRY_CREDENTIAL_USERNAME=harbor_registry_user
  - REGISTRY_URL=http://harbor-registry:5000
  - TOKEN_SERVICE_URL=http://harbor-core:80/service/token
- name: harbor-config-override-template
  options:
    disableNameSuffixHash: true
  literals:
  - auth_mode=oidc_auth
  - primary_auth_mode=true
  - project_creation_restriction=adminonly
  - read_only=false
  - token_expiration=30
  - oidc_name=seigra.net
  - oidc_endpoint=https://auth.seigra.net/realms/home
  - oidc_extra_redirect_parms={}
  - oidc_client_id=harbor
  - oidc_groups_claim=groups
  - oidc_admin_group=admin
  - oidc_scope=openid
  - oidc_verify_cert=true
  - oidc_auto_onboard=true
  - oidc_user_claim=email
  - robot_token_duration=30
  - robot_name_prefix=robot$
  - audit_log_forward_endpoint=""
  - skip_audit_log_database=false
  - scanner_skip_update_pulltime=true
  - banner_message=""

labels:
- pairs:
    app.kubernetes.io/instance: harbor
    app.kubernetes.io/part-of: harbor
  includeSelectors: true
  includeTemplates: true

replicas:
- name: harbor-core
  count: 2
- name: harbor-jobservice
  count: 2
- name: harbor-portal
  count: 2
- name: harbor-registry
  count: 2
- name: harbor-trivy
  count: 2

images:
- name: ghcr.io/cloudnative-pg/postgresql
  newTag: 19.0-minimal-trixie@sha256:12688a494f25aa0b7e1e3cd1800abe85b427fd1a09c991668a48162e3431a2af
- name: ghcr.io/goharbor/harbor-core
  newTag: v2.16.0@sha256:9174a38ef7de02a6b2aa228906465e0e46426ba6f3e6c900cd6090ceaec1c3e7
- name: ghcr.io/goharbor/harbor-jobservice
  newTag: v2.16.0@sha256:0f55399b8b8316f30976a5474c4cecb3641ee988496e68f3c218ecc7e1324ab4
- name: ghcr.io/goharbor/harbor-portal
  newTag: v2.16.0@sha256:60411e3b273d9b27aa8e95871c7f8f3e6b4de512e72e19f40fca910e60518c3c
- name: ghcr.io/goharbor/harbor-registryctl
  newTag: v2.16.0@sha256:f2b22ddb6d65e91c676d9bf5e28ecd50ef22d5430d9941eb51a57f6e33c0d3bc
- name: ghcr.io/goharbor/registry-photon
  newTag: v2.16.0@sha256:c9c4f8a9376c7ae24f32e9212e56064f524cd8f0a23755618f2df99767b0ac3e
- name: ghcr.io/goharbor/trivy-adapter-photon
  newTag: v2.16.0@sha256:36ab1b63ba2ac230e7f9f5d2725fe999a27b1fc270b7b5ae1419fd8f46b0b969
- name: docker.io/oliver006/redis_exporter
  newTag: v1.99.0-alpine@sha256:7c3fbd30b73ffa151654f092713ff7b39a98dcbf35266439c4e8f08ad93b005e
- name: ghcr.io/valkey-io/valkey
  newTag: 9.0.0-alpine3.22@sha256:bef37d06d4856710973ee31dd1eac1482e4c8e6e7b847f999ad25433e646587b
